name: Torn Cash Flow Analyzer v0.2.48 multi-workspace projection

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0248-multiworkspace-projection-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python .github/scripts/tta-v0248-multiworkspace-projection.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -Fq '// @version      0.2.48' torn-trade-analyzer.user.js
          grep -Fq "const VERSION = '0.2.48';" torn-trade-analyzer.user.js
          grep -Fq 'itemRowsOwnCashMovement' torn-trade-analyzer.user.js
          grep -Fq 'Multi-workspace projection' torn-trade-analyzer.user.js
          grep -Fq 'function transactionCashFlows()' torn-trade-analyzer.user.js
          grep -Fq 'function acquisitionLedgerRows()' torn-trade-analyzer.user.js
          grep -Fq 'function dailyNetWorthActivity' torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          b=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(x < 128 for x in b), 'userscript must remain ASCII-safe'
          print('ASCII-safe')
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Preserve multi-workspace transaction projections'
          git push
