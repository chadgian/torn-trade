name: Build Cash Flow Analyzer v0.2.3 PDA compatibility

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v023-pda-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v023-fab-visibility
          fetch-depth: 0
      - name: Apply PDA compatibility patch
        run: python .github/scripts/v023_pda_compat.py
      - name: Validate JavaScript syntax
        run: |
          node --check torn-trade-analyzer.user.js
          node -e "new Function(require('fs').readFileSync('torn-trade-analyzer.user.js','utf8')); console.log('Function parser passed')"
      - name: Verify startup compatibility markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          assert '@version      0.2.3' in s
          assert "const VERSION = '0.2.3';" in s
          assert 'function ensureFabMounted()' in s
          assert 'function startFabGuard()' in s
          assert "z-index:2147483646;isolation:isolate;visibility:visible;opacity:1;pointer-events:auto" in s
          dash=s[s.index('  function dashboardHtml()'):s.index('  function cashFlowDateRange')]
          cash=s[s.index('  function cashFlowHtml()'):s.index('  function labeledKey')]
          assert "?'':'s'" not in dash
          assert "?'':'s'" not in cash
          assert 'Today&#39;s cash movements' in dash
          print('PDA compatibility markers verified')
          PY
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.3 PDA startup compatibility"
            git push origin HEAD:codex/v023-fab-visibility
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.3 PDA compatibility build completed and parser validation passed."
