name: Torn Cash Flow Analyzer v0.2.44 selected-day snapshots

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0244-networth-day-snapshots-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.44') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta-v0244-networth-day-snapshots.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.44" torn-trade-analyzer.user.js
          grep -F "Torn snapshot movement within selected day" torn-trade-analyzer.user.js
          grep -F "Only one Torn snapshot this day" torn-trade-analyzer.user.js
          grep -F "snapshots.length>=2?snapshots[0]:null" torn-trade-analyzer.user.js
          grep -F "Analyzer-detected movement" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          b=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(x < 128 for x in b)
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Use within-day snapshots for Net Worth movement'
          git push origin main
