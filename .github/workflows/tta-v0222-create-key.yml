name: Torn Cash Flow Analyzer v0.2.22 custom API key setup

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0222-create-key-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0222-create-key.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.22" torn-trade-analyzer.user.js
          grep -F "const ANALYZER_CUSTOM_KEY_URL" torn-trade-analyzer.user.js
          grep -F "step=addNewKey&title=CashFlowAnalyzer" torn-trade-analyzer.user.js
          grep -F "user=log,trade,trades,money,networth" torn-trade-analyzer.user.js
          grep -F "company=profile,employees" torn-trade-analyzer.user.js
          grep -F "torn=items,logtypes" torn-trade-analyzer.user.js
          grep -F "data-act=\"createApiKey\"" torn-trade-analyzer.user.js
          grep -F "else if(act==='createApiKey')" torn-trade-analyzer.user.js
          grep -F ".tta-keyinputrow{grid-template-columns:minmax(0,1fr) auto auto}" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Add one-tap custom API key setup'
          git push origin main
