name: Torn Trade Analyzer v0.1.22 freshness fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v0122-recent-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tta_v0122_patch.py
      - name: Validate JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Validate release invariants
        run: |
          grep -F '// @version      0.1.22' torn-trade-analyzer.user.js
          grep -F "const RECENT_LOG_RECHECK_SEC = 72 * 3600;" torn-trade-analyzer.user.js
          grep -F "Foreign Market acquisitions in last scan:" torn-trade-analyzer.user.js
          grep -F '**Current version:** v0.1.22' README.md
      - name: Commit production release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js README.md
          git commit -m 'Torn Trade Analyzer v0.1.22 recent sync freshness fix'
          git push
      - name: Write verifier marker
        run: |
          echo 'PASS: v0.1.22 syntax + 72h recent User Log refresh + foreign acquisition diagnostics + parser hardening' > .tta-v0122-status.txt
          git add .tta-v0122-status.txt
          git commit -m 'Verify Torn Trade Analyzer v0.1.22'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment 'Published and verified v0.1.22.'
