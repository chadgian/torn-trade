name: Torn Cash Flow Analyzer v0.2.43 net worth reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0243-networth-reconcile-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.43') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta-v0243-networth-reconcile.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.43" torn-trade-analyzer.user.js
          grep -F "Analyzer-detected movement" torn-trade-analyzer.user.js
          grep -F "Cash paid" torn-trade-analyzer.user.js
          grep -F "Est. net-worth impact" torn-trade-analyzer.user.js
          grep -F "difference vs Torn snapshot" torn-trade-analyzer.user.js
          grep -F "detectedNet" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          b=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(x < 128 for x in b)
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Reconcile detected Net Worth event impacts'
          git push origin main
