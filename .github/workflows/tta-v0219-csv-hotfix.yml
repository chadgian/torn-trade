name: Torn Cash Flow Analyzer v0.2.19 CSV hotfix

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0219-csv-hotfix-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0219-csv-hotfix.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.19" torn-trade-analyzer.user.js
          grep -F "join(String.fromCharCode(10))" torn-trade-analyzer.user.js
          grep -F "s.includes(String.fromCharCode(10))" torn-trade-analyzer.user.js
          grep -F "[4800,{direction:'out',field:'money',category:'Player Transfers'" torn-trade-analyzer.user.js
          grep -F "[4102,{direction:'out',label:'Item sent'}]" torn-trade-analyzer.user.js
          grep -F "function insightsHtml()" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Fix CSV export and finalize finance suite'
          git push origin main
