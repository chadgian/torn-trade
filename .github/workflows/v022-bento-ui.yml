name: Build Cash Flow Analyzer v0.2.2 Bento UI

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v022-bento-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v022-bento-ui
          fetch-depth: 0
      - name: Apply Bento UI patch
        run: python .github/scripts/v022_write_fix.py
      - name: Validate userscript
        run: node --check torn-trade-analyzer.user.js
      - name: Verify UI behavior markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          required=[
            '@version      0.2.2',
            'Consolidated cash flow today',
            'tta-navcard',
            'overflow-x:hidden!important',
            'Today’s cash movements',
            'function cashFlowBoundsToday() {const now=nowSec();return {from:tctDayStart(now),to:now};}',
            'scroll-snap-type:x proximity',
            'flowLegendHtml()',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing markers: {missing}'
          assert s.count('class="tta-navcard"') >= 3
          print('UI markers verified')
          PY
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.2 Bento UI refresh"
            git push origin HEAD:codex/v022-bento-ui
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.2 Bento UI build completed and syntax validation passed."
