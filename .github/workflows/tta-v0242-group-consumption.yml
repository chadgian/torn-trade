name: Torn Cash Flow Analyzer v0.2.42 grouped consumption

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0242-group-consumption-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta-v0242-group-consumption.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.42" torn-trade-analyzer.user.js
          grep -F "const consumptionGroups=new Map();" torn-trade-analyzer.user.js
          grep -F "use logs combined" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          b=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(x < 128 for x in b)
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Group repeated item consumption in Net Worth'
          git push origin main
