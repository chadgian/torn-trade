name: Verify live Torn Cash Flow Analyzer v0.4.3

on:
  push:
    branches: [main]
    paths:
      - '.verify-live-v043-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Worker endpoint
        run: |
          set -euo pipefail
          url="https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js?verify=$(date +%s)"
          curl -fLsS --retry 5 --retry-delay 4 "$url" -o /tmp/live.user.js
          grep -Fq '// @version      0.4.3' /tmp/live.user.js
          grep -Fq "const VERSION = '0.4.3';" /tmp/live.user.js
          grep -Fq 'PAGE_BATCH_SPLIT' /tmp/live.user.js
          grep -Fq 'dense-date-probe' /tmp/live.user.js
          grep -Fq 'logBatchSplits' /tmp/live.user.js
          echo "Live Worker is serving v0.4.3 adaptive pagination recovery."
