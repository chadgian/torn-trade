name: Torn Cash Flow Analyzer v0.2.24 click fix and landscape layout

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0224-click-landscape-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0224-click-landscape.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.24" torn-trade-analyzer.user.js
          grep -F "captured:false" torn-trade-analyzer.user.js
          grep -F "Math.hypot(dx,dy)<7" torn-trade-analyzer.user.js
          grep -F "@media (min-width:900px) and (orientation:landscape)" torn-trade-analyzer.user.js
          grep -F "grid-template-columns:repeat(4,minmax(0,1fr))" torn-trade-analyzer.user.js
          grep -F "max-width:1180px" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Fix workspace clicks and improve landscape layout'
          git push origin main
