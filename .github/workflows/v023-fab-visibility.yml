name: Build Cash Flow Analyzer v0.2.3 FAB visibility

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v023-fab-visibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v023-fab-visibility
          fetch-depth: 0
      - name: Apply FAB patch
        run: python .github/scripts/v023_fab_visibility.py
      - name: Validate userscript
        run: node --check torn-trade-analyzer.user.js
      - name: Verify launcher markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          required=['@version      0.2.3','tta-fab-hidden','ensureFabMounted()','MutationObserver','z-index:2147483646!important','setInterval(()=>{if(!document.getElementById(\'tta-fab\'))ensureFabMounted()']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('FAB markers verified')
          PY
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          git commit -m "Cash Flow Analyzer v0.2.3 restore floating launcher"
          git push origin HEAD:codex/v023-fab-visibility
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.3 FAB visibility build completed and syntax validation passed."
