name: Torn Cash Flow Analyzer v0.2.21 floating edge snap

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0221-fab-snap-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0221-fab-snap.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.21" torn-trade-analyzer.user.js
          grep -F "function snapFabPosition" torn-trade-analyzer.user.js
          grep -F "#tta-fab.snapping" torn-trade-analyzer.user.js
          grep -F "state.fabPosition=p;save('fabPosition',p)" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Snap floating launcher to nearest screen edge'
          git push origin main
