name: Torn Cash Flow Analyzer v0.2.32 responsive text cleanup

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0232-responsive-text-dedupe-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.32') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0232-responsive-text-dedupe.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.32" torn-trade-analyzer.user.js
          grep -F "v0.2.32 cross-device text and spacing safety" torn-trade-analyzer.user.js
          test "$(grep -c 'cross-device text and spacing safety' torn-trade-analyzer.user.js)" -eq 1
          grep -F "text-size-adjust:100%" torn-trade-analyzer.user.js
          grep -F "@media(max-width:430px)" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s), 'userscript is not ASCII-safe'
          PY

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Deduplicate responsive text safety styles'
          git push origin main
