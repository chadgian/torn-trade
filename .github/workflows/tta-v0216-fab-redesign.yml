name: Torn Cash Flow Analyzer v0.2.16 floating launcher redesign

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0216-fab-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0216-patch.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.16" torn-trade-analyzer.user.js
          grep -F "width:52px;height:52px" torn-trade-analyzer.user.js
          grep -F "tta-fab-panel" torn-trade-analyzer.user.js
          grep -F "linear-gradient(145deg,#31594f,#294a51" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Redesign floating launcher to match glass UI'
          git push origin main
