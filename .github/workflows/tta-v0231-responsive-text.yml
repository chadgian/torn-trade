name: Torn Cash Flow Analyzer v0.2.31 responsive text

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0231-responsive-text-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0231-responsive-text.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.31" torn-trade-analyzer.user.js
          grep -F "v0.2.31 cross-device text and spacing safety" torn-trade-analyzer.user.js
          grep -F "text-size-adjust:100%" torn-trade-analyzer.user.js
          grep -F ".tta-sectionintro>div" torn-trade-analyzer.user.js
          grep -F ".tta-portal-head>div" torn-trade-analyzer.user.js
          grep -F "line-height:1.2" torn-trade-analyzer.user.js
          grep -F "@media(max-width:430px)" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s), 'userscript is not ASCII-safe'
          PY

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Harden responsive text spacing across devices'
          git push origin main
