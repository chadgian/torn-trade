name: Validate Cash Flow Analyzer v0.2.1 full resync safety

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v021-sync-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v021-sync-modes
          fetch-depth: 0
      - name: Apply safety patch
        run: python .github/scripts/v021_safety.py
      - name: Validate userscript
        run: node --check torn-trade-analyzer.user.js
      - name: Verify safety behavior
        run: |
          grep -q "API access confirmed · local discovered history cleared" torn-trade-analyzer.user.js
          grep -q "if(!job)job=createResumableSyncJob(requestedMode)" torn-trade-analyzer.user.js
      - name: Commit branch build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.1 protect history before full resync starts"
            git push origin HEAD:codex/v021-sync-modes
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.1 full-resync safety validation passed."
