name: Torn Cash Flow Analyzer v0.2.33 crime cash

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0233-crime-cash-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.33') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0233-crime-cash.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.33" torn-trade-analyzer.user.js
          grep -F "parsedItemRows?.length&&!crimeContext" torn-trade-analyzer.user.js
          grep -F "source:crimeContext?'Crime Reward':'Torn Log'" torn-trade-analyzer.user.js
          grep -F "crime|burglary|shoplift|theft|robbery|pickpocket|fraud|hustl|bootleg|disposal|cybercrime" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s), 'userscript is not ASCII-safe'
          PY

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Record successful crime cash rewards'
          git push origin main
