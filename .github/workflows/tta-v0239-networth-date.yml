name: Torn Cash Flow Analyzer v0.2.39 Net Worth date

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0239-networth-date-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.39') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta-v0239-networth-date.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.39" torn-trade-analyzer.user.js
          grep -F "function selectedNetWorthDay()" torn-trade-analyzer.user.js
          grep -F "id=\"tta-networth-date\"" torn-trade-analyzer.user.js
          grep -F "Recorded company profit / loss" torn-trade-analyzer.user.js
          grep -F "netWorthTrackingStartedAt" torn-trade-analyzer.user.js
          grep -F "data-act=\"netWorthToday\"" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s)
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Add selectable daily Net Worth changes'
          git push origin main
