name: Torn Cash Flow Analyzer v0.2.30 activity details

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0230-activity-details-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0230-activity-details.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.30" torn-trade-analyzer.user.js
          grep -F "const VERSION = '0.2.30';" torn-trade-analyzer.user.js
          grep -F "function transactionItemDetail" torn-trade-analyzer.user.js
          grep -F "function playerTradeItemDetail" torn-trade-analyzer.user.js
          grep -F "function flowDetailText" torn-trade-analyzer.user.js
          grep -F "Gave ${gave}" torn-trade-analyzer.user.js
          grep -F "Received ${received}" torn-trade-analyzer.user.js
          grep -F "'Details','Source','Amount','Item ID','Quantity'" torn-trade-analyzer.user.js
          grep -F '${flowDetailText(x)}' torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s), 'userscript is not ASCII-safe'
          PY

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Show item details in financial activity'
          git push origin main
