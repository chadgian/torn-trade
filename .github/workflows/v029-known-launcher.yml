name: Validate Cash Flow Analyzer v0.2.9 launcher

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: github.event.issue.title == 'validate-v029-known-launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v029-known-good-launcher
          fetch-depth: 0
      - name: Apply in-place upgrade fixes
        run: python .github/scripts/v029_upgrade_fix.py
      - name: JavaScript syntax check
        run: node --check torn-trade-analyzer.user.js
      - name: Structural regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          assert '@version      0.2.9' in s
          assert "fresh.id='tta-fab'" in s
          assert "root.id='tta-root'" in s
          assert "s.id = 'tta-css-v029'" in s
          assert "document.getElementById('tcfa-css-v028')?.remove()" in s
          assert '#tta-fab{position:fixed' in s
          assert '#tta-fab .tta-terminal-frame' in s
          assert '#tta-root{position:fixed' in s
          assert "document.getElementById('tcfa-root')?.remove()" in s
          assert 'function suppressLegacyUi' not in s
          assert 'function tcfaOwnsRuntime' not in s
          print('PASS: v0.2.9 DOM and stylesheet contracts are internally consistent')
          PY
      - name: Install DOM test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24.1.3
      - name: Execute clean-boot and v0.2.8 in-place upgrade DOM tests
        run: node .github/tests/v029_upgrade_dom_test.js
      - name: Commit validated production files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.9 fix in-place launcher upgrade"
            git push origin HEAD:codex/v029-known-good-launcher
          fi
      - name: Close validation issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.9 passed clean-boot and realistic v0.2.8 in-place upgrade tests, including stylesheet replacement, themed launcher visibility, click-to-open, DOM recovery and reinjection."
