name: Torn Cash Flow Analyzer v0.2.28 company history

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0228-company-history-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0228-company-history.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.28" torn-trade-analyzer.user.js
          grep -F "companyHistory: load('companyHistory', [])" torn-trade-analyzer.user.js
          grep -F "company=profile,employees,snapshot" torn-trade-analyzer.user.js
          grep -F "async function refreshHistoricalCompanyIncome" torn-trade-analyzer.user.js
          grep -F "apiGetText('/company/snapshot'" torn-trade-analyzer.user.js
          grep -F "Historical snapshot income is gross only" torn-trade-analyzer.user.js
          grep -F "Gross-only snapshot rows are informational and are excluded from Cash Flow earned/spent totals" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s), 'userscript is not ASCII-safe'
          PY

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Backfill company income history from Torn snapshots'
          git push origin main
