name: Build Cash Flow Analyzer v0.2.13 mug and company profit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v0213-mug-company'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0213-mug-company-profit
          fetch-depth: 0
      - name: Apply accounting patch
        run: python .github/scripts/v0213_mug_company.py
      - name: Validate userscript
        run: node --check torn-trade-analyzer.user.js
      - name: Verify accounting markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          required=[
            '@version      0.2.13',
            "if(Number(logTypeId)===8155)return 'in';",
            "if(Number(logTypeId)===8156)return 'out';",
            'Company Profit / Loss',
            'refreshCompanyDailyAdjustment',
            'repairCashFlowAccountingRows();',
            "if(/company/i.test(title)&&/\\b(deposit|withdraw(?:al)?)\\b/i.test(title))return[];",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing markers: {missing}'
          print('Accounting markers verified')
          PY
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+chadgian@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.13 mug and company profit accounting"
            git push origin HEAD:codex/v0213-mug-company-profit
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.13 accounting build completed and validation passed."
