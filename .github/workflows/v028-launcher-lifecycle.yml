name: Build Cash Flow Analyzer v0.2.8 launcher lifecycle repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v028-launcher-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v028-launcher-lifecycle
          fetch-depth: 0
      - name: Apply launcher lifecycle repair
        run: python .github/scripts/v028_launcher_lifecycle.py
      - name: Validate JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Verify root-cause markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          assert '@version      0.2.8' in s
          assert "if(existingTcfaRuntime?.version===VERSION) return;" not in s
          assert 'previousTcfaRuntime' in s
          assert 'function analyzerOverlayVisible()' in s
          assert "if(fabIsInteractable(fab))suppressLegacyUi();" in s
          assert "launcherPositionResetV028" in s
          assert "__TCFA_LAUNCHER_WATCH_V028__" in s
          assert "if(state.open&&(!root||!root.isConnected||!root.classList.contains('show'))){state.open=false;}" in s
          print('v0.2.8 launcher lifecycle markers verified')
          PY
      - name: Commit repaired production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.8 launcher lifecycle repair"
            git push origin HEAD:codex/v028-launcher-lifecycle
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.8 launcher lifecycle repair built and validated."
