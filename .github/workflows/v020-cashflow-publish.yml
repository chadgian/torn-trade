name: Build Torn Cash Flow Analyzer v0.2.0

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v020-cash-flow-analyzer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v020-cash-flow-analyzer
          fetch-depth: 0
      - name: Apply cash-flow redesign
        run: |
          python .github/scripts/v020_part1.py
          python .github/scripts/v020_part2.py
          python .github/scripts/v020_part3.py
      - name: Validate userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F '// @name         Torn Cash Flow Analyzer' torn-trade-analyzer.user.js
          grep -F '// @version      0.2.0' torn-trade-analyzer.user.js
          grep -F "function cashFlowHtml()" torn-trade-analyzer.user.js
          grep -F "function netWorthHtml()" torn-trade-analyzer.user.js
          grep -F "function transactionCashFlows()" torn-trade-analyzer.user.js
          grep -F "apiGet('/user/networth')" torn-trade-analyzer.user.js
          grep -F "apiGet('/user/money')" torn-trade-analyzer.user.js
          grep -F "state.view==='trade'?tradeHtml():dashboardHtml()" torn-trade-analyzer.user.js
          grep -F '**Current version:** v0.2.0' README.md
      - name: Commit feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- torn-trade-analyzer.user.js README.md
          git commit -m 'Torn Cash Flow Analyzer v0.2.0' || true
          git push origin HEAD:codex/v020-cash-flow-analyzer
      - name: Close trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment 'Built and syntax-validated v0.2.0 on codex/v020-cash-flow-analyzer.'
