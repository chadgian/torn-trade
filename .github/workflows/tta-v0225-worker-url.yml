name: Torn Cash Flow Analyzer v0.2.25 Worker URL

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0225-worker-url-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0225-worker-url.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.25" torn-trade-analyzer.user.js
          grep -F "const VERSION = '0.2.25';" torn-trade-analyzer.user.js
          grep -F "// @updateURL    https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          grep -F "// @downloadURL  https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Use neutral Worker URL for script updates'
          git push origin main
