name: Torn Trade Analyzer v0.1.24 TCT gap-aware sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v0124-tct-gap-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tta_v0124_patch.py
      - name: Validate JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Validate release invariants
        run: |
          grep -F '// @version      0.1.24' torn-trade-analyzer.user.js
          grep -F 'function selectedPeriodBoundsTct' torn-trade-analyzer.user.js
          grep -F 'logDayCoverage' torn-trade-analyzer.user.js
          grep -F 'Filling ${missing} missing TCT day' torn-trade-analyzer.user.js
          grep -F 'Sync checked through ${tctDateTimeStr(serverNow)} TCT' torn-trade-analyzer.user.js
          grep -F '**Current version:** v0.1.24' README.md
      - name: Commit production release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js README.md
          git commit -m 'Torn Trade Analyzer v0.1.24 TCT day-gap sync'
          git push
      - name: Write verifier marker
        run: |
          echo 'PASS: v0.1.24 syntax + TCT server target + per-day gap coverage + current-day refresh' > .tta-v0124-status.txt
          git add .tta-v0124-status.txt
          git commit -m 'Verify Torn Trade Analyzer v0.1.24'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment 'Published and verified v0.1.24.'