name: Torn Cash Flow Analyzer v0.2.26 company 18 TCT

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0226-company-1800-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0226-company-1800.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.26" torn-trade-analyzer.user.js
          grep -F "const VERSION = '0.2.26';" torn-trade-analyzer.user.js
          grep -F "const cycleDay=tctDayStart(serverTs-(18*3600)),calculatedAt=cycleDay+(18*3600)" torn-trade-analyzer.user.js
          grep -F "timestamp:calculatedAt" torn-trade-analyzer.user.js
          grep -F "storedCycle<=cycleDay" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Anchor company daily cash flow at 18 TCT'
          git push origin main
