name: Build Cash Flow Analyzer v0.2.10 Launcher Diagnostics

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v0210-launcher-debug'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0210-launcher-debug
          fetch-depth: 0
      - name: Apply diagnostics patch
        run: python .github/scripts/v0210_launcher_debug.py
      - name: Validate userscript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Verify diagnostics markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          required=[
            '@version      0.2.10',
            "const TTA_DEBUG_PREFIX='[TTA]'",
            "window.__TTA_DEBUG_DUMP__",
            "BOOT: script evaluated",
            "CSS: injectCss start",
            "MOUNT: start",
            "FAB: creating launcher",
            "FAB SNAPSHOT:",
            "RENDER: enter",
            "WATCHDOG: installed",
            "UNHANDLED REJECTION",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing diagnostics markers: {missing}'
          print('v0.2.10 launcher diagnostics markers verified')
          PY
      - name: Commit diagnostics build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.10 launcher diagnostics"
            git push origin HEAD:codex/v0210-launcher-debug
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.10 launcher diagnostics build completed and syntax validation passed."
