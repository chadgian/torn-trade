name: Torn Cash Flow Analyzer v0.2.41 full resync progress

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0241-resync-progress-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.41') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta-v0241-resync-progress.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.41" torn-trade-analyzer.user.js
          grep -F "function fullResyncProgressMetrics" torn-trade-analyzer.user.js
          grep -F "function decorateSyncProgress" torn-trade-analyzer.user.js
          grep -F "estimating time left" torn-trade-analyzer.user.js
          grep -F "progressActiveMs" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          b=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(x < 128 for x in b)
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Add Full Resync percentage and ETA'
          git push origin main
