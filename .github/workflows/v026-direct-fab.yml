name: Build Cash Flow Analyzer v0.2.6 Direct FAB

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v026-direct-fab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v026-direct-fab
          fetch-depth: 0
      - name: Apply direct FAB repair
        run: python .github/scripts/v026_direct_fab.py
      - name: Validate userscript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Verify launcher architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          required=[
            '@version      0.2.6',
            "const VERSION = '0.2.6';",
            "document.getElementById('tta-fab')",
            "parent.appendChild(fab)",
            "z-index','2147483647'",
            'function ensureFabMounted()',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          forbidden=['function getFabHost()', 'function shadowFabMarkup()', "attachShadow({mode:'open'})"]
          found=[x for x in forbidden if x in s]
          assert not found, found
          print('Direct FAB architecture verified')
          PY
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cash Flow Analyzer v0.2.6 restore direct floating launcher"
            git push origin HEAD:codex/v026-direct-fab
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.6 direct FAB repair built and validated."
