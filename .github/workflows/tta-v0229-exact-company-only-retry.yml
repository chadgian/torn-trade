name: Torn Cash Flow Analyzer v0.2.29 exact company only retry

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0229-exact-company-only-retry-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0229-exact-company-only-retry.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.29" torn-trade-analyzer.user.js
          grep -F "const VERSION = '0.2.29';" torn-trade-analyzer.user.js
          grep -F "company=profile,employees&torn=items,logtypes" torn-trade-analyzer.user.js
          grep -F "const cycleDay=tctDayStart(serverTs-(18*3600)),calculatedAt=cycleDay+(18*3600)" torn-trade-analyzer.user.js
          grep -F "timestamp:calculatedAt" torn-trade-analyzer.user.js
          ! grep -F "companyHistory" torn-trade-analyzer.user.js
          ! grep -F "/company/snapshot" torn-trade-analyzer.user.js
          ! grep -F "employees,snapshot" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(b < 128 for b in s), 'userscript is not ASCII-safe'
          PY

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Keep company profit loss exact from observed days'
          git push origin main
