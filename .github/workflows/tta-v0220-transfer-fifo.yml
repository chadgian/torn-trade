name: Torn Cash Flow Analyzer v0.2.20 transfer FIFO

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0220-transfer-fifo-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0220-transfer-fifo.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.20" torn-trade-analyzer.user.js
          grep -F "side:'transfer-out'" torn-trade-analyzer.user.js
          grep -F "row.transferredQty+=take" torn-trade-analyzer.user.js
          grep -F "status==='transferred'?'Transferred'" torn-trade-analyzer.user.js
          grep -F "consume the oldest available FIFO lots" torn-trade-analyzer.user.js
          grep -F "join(String.fromCharCode(10))" torn-trade-analyzer.user.js

      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Apply player item transfers to FIFO inventory'
          git push origin main
