name: Torn Trade Analyzer v0.1.25 continuous TCT timeline

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v0125-continuous-tct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tta_v0125_patch.py
      - name: Validate JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Validate release invariants
        run: |
          grep -F '// @version      0.1.25' torn-trade-analyzer.user.js
          grep -F 'function tctWeekStart' torn-trade-analyzer.user.js
          grep -F 'function tctMonthStart' torn-trade-analyzer.user.js
          grep -F "if(state.dateMode==='all')" torn-trade-analyzer.user.js
          grep -F "if(!m.has(k))m.set(k,0)" torn-trade-analyzer.user.js
          grep -F "timeZone:'UTC'" torn-trade-analyzer.user.js
          grep -F '**Current version:** v0.1.25' README.md
      - name: Commit production release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js README.md
          git commit -m 'Torn Trade Analyzer v0.1.25 continuous TCT timeline'
          git push
      - name: Write verifier marker
        run: |
          echo 'PASS: v0.1.25 syntax + continuous TCT day/week/month buckets + zero-profit dates' > .tta-v0125-status.txt
          git add .tta-v0125-status.txt
          git commit -m 'Verify Torn Trade Analyzer v0.1.25'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment 'Published and verified v0.1.25.'
