name: Torn Cash Flow Analyzer v0.2.15 UI help and daily net-worth activity

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0215-ui-help-networth-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/tta-v0215-patch.py

      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.15" torn-trade-analyzer.user.js
          grep -F "function helpHtml()" torn-trade-analyzer.user.js
          grep -F "Today&#39;s recent net-worth changes" torn-trade-analyzer.user.js
          grep -F "FEATURE PORTAL" torn-trade-analyzer.user.js
          if grep -Fq '<small>Internal transfers</small>' torn-trade-analyzer.user.js; then
            echo 'Dashboard internal transfer card still present'
            exit 1
          fi

      - name: Commit userscript
        run: |
          if git diff --quiet -- torn-trade-analyzer.user.js; then
            echo 'No userscript changes to commit.'
            exit 0
          fi
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Add help, daily net-worth activity and feature portal'
          git push origin main
