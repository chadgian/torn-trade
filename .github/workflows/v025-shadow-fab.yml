name: Build Cash Flow Analyzer v0.2.5 Shadow FAB

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'build-v025-shadow-fab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v025-shadow-fab
          fetch-depth: 0
      - name: Apply launcher patch
        run: python .github/scripts/v025_shadow_fab.py
      - name: Validate userscript
        run: node --check torn-trade-analyzer.user.js
      - name: Verify launcher markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          req=['@version      0.2.5','tta-fab-host','attachShadow({mode:\'open\'})','shadowFabMarkup()','function getFab()','document.body||document.documentElement']
          missing=[x for x in req if x not in s]
          assert not missing, missing
          print('Shadow launcher markers verified')
          PY
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js README.md
          git commit -m "Cash Flow Analyzer v0.2.5 Shadow DOM launcher"
          git push origin HEAD:codex/v025-shadow-fab
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "v0.2.5 Shadow DOM launcher build completed and syntax validation passed."
