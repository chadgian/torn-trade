name: Verify live Torn Cash Flow Analyzer v0.3.8

on:
  push:
    branches: [main]
    paths:
      - '.verify-live-v038-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Worker endpoint
        run: |
          set -euo pipefail
          url="https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js?verify=$(date +%s)"
          curl -fLsS --retry 3 --retry-delay 2 "$url" -o /tmp/live.user.js
          grep -Fq '// @version      0.3.8' /tmp/live.user.js
          grep -Fq "const VERSION = '0.3.8';" /tmp/live.user.js
          grep -Fq 'trade-boundary-probe' /tmp/live.user.js
          echo "Live Worker is serving v0.3.8 with repeated Player Trades recovery."
