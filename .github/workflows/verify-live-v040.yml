name: Verify live Torn Cash Flow Analyzer v0.4.0

on:
  push:
    branches: [main]
    paths:
      - '.verify-live-v040-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Worker endpoint
        run: |
          set -euo pipefail
          url="https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js?verify=$(date +%s)"
          curl -fLsS --retry 4 --retry-delay 3 "$url" -o /tmp/live.user.js
          grep -Fq '// @version      0.4.0' /tmp/live.user.js
          grep -Fq "const VERSION = '0.4.0';" /tmp/live.user.js
          grep -Fq "What's New" /tmp/live.user.js
          grep -Fq 'Suggested action' /tmp/live.user.js
          grep -Fq 'profiles.php?XID=4325416' /tmp/live.user.js
          grep -Fq 'tta-nw-metric-card' /tmp/live.user.js
          echo "Live Worker is serving v0.4.0."
