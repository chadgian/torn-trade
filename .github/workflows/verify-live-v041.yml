name: Verify live Torn Cash Flow Analyzer v0.4.1

on:
  push:
    branches: [main]
    paths:
      - '.verify-live-v041-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Worker endpoint
        run: |
          set -euo pipefail
          url="https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js?verify=$(date +%s)"
          curl -fLsS --retry 4 --retry-delay 3 "$url" -o /tmp/live.user.js
          grep -Fq '// @version      0.4.1' /tmp/live.user.js
          grep -Fq "const VERSION = '0.4.1';" /tmp/live.user.js
          grep -Fq 'tta-navicon' /tmp/live.user.js
          grep -Fq 'Workspace transitions are a small status pill' /tmp/live.user.js
          grep -Fq 'tta-quality>span::before' /tmp/live.user.js
          echo "Live Worker is serving v0.4.1 UI polish."
