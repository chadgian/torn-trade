name: Verify live Torn Cash Flow Analyzer v0.4.4

on:
  push:
    branches: [main]
    paths:
      - '.verify-live-v044-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Worker endpoint
        run: |
          set -euo pipefail
          url="https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js?verify=$(date +%s)"
          curl -fLsS --retry 5 --retry-delay 4 "$url" -o /tmp/live.user.js
          grep -Fq '// @version      0.4.4' /tmp/live.user.js
          grep -Fq "const VERSION = '0.4.4';" /tmp/live.user.js
          grep -Fq 'reloadDurableStorage' /tmp/live.user.js
          grep -Fq 'BroadcastChannel' /tmp/live.user.js
          grep -Fq 'Another Torn tab is syncing. You can keep viewing the locally stored TCFA history here.' /tmp/live.user.js
          grep -Fq 'crossTabSignal' /tmp/live.user.js
          echo "Live Worker is serving v0.4.4 cross-tab history support."
