name: Torn Cash Flow Analyzer v0.2.40 item consumption

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0240-item-consumption-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove v0.2.40') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta-v0240-item-consumption.py
      - name: Verify userscript
        run: |
          node --check torn-trade-analyzer.user.js
          grep -F "// @version      0.2.40" torn-trade-analyzer.user.js
          grep -F "itemConsumptions: load('itemConsumptions', [])" torn-trade-analyzer.user.js
          grep -F "function parseItemConsumptionEntry" torn-trade-analyzer.user.js
          grep -F "side:'consume-out'" torn-trade-analyzer.user.js
          grep -F "Est. value removed" torn-trade-analyzer.user.js
          grep -F "tta-statuspill.consumed" torn-trade-analyzer.user.js
          grep -F "https://torn-trade.obliviate.workers.dev/torn-trade-analyzer.user.js" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          b=Path('torn-trade-analyzer.user.js').read_bytes()
          assert all(x < 128 for x in b)
          PY
      - name: Commit userscript
        run: |
          git config user.name 'chatgpt-torn-maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Track item consumption in Net Worth and FIFO inventory'
          git push origin main
